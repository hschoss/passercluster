---
# Node 200: control plane only; Longhorn components may run, but no disks are scheduled.
apiVersion: v1
kind: Node
metadata:
  name: talos-krw-er8
  labels:
    storage.passercluster.io/longhorn: disabled
    storage.passercluster.io/node-id: "200"
    node.longhorn.io/create-default-disk: "false"
---
# Node 202: performance primary NVMe tier.
apiVersion: v1
kind: Node
metadata:
  name: talos-7tm-1kh
  labels:
    storage-tier: performance
    disk-type: nvme
    storage.passercluster.io/longhorn: enabled
    storage.passercluster.io/node-id: "202"
    node.longhorn.io/create-default-disk: "false"
---
# Node 201 (passer-w-01): 1 TB NVMe. Install + Longhorn data share the disk.
apiVersion: v1
kind: Node
metadata:
  name: passer-w-01
  labels:
    storage-tier: performance
    disk-type: nvme
    storage.passercluster.io/longhorn: enabled
    storage.passercluster.io/node-id: "201"
    node.longhorn.io/create-default-disk: "false"
---
# Node 203 (passer-w-03): 2x4TB Seagate HDD (sda, sdb), 1x500GB WDC HDD (sdc),
# 1x250GB Samsung 860 SSD (sdd, holds Talos install). Talos UserVolumeConfig
# (live on the node, see talos/user-volumes-passer-w-03.yaml) mounts sda1 at
# /var/mnt/longhorn-sda and sdb1 at /var/mnt/longhorn-sdb; both are exposed to
# Longhorn below with hdd/media tags. sdc is unused.
apiVersion: v1
kind: Node
metadata:
  name: passer-w-03
  labels:
    storage-tier: capacity
    disk-type: hdd
    storage.passercluster.io/longhorn: enabled
    storage.passercluster.io/node-id: "203"
    node.longhorn.io/create-default-disk: "false"
---
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: talos-krw-er8
  namespace: longhorn-system
  labels:
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/part-of: storage
spec:
  allowScheduling: false
  tags: []
  disks:
    default-disk-1030400000000:
      path: /var/lib/longhorn
      allowScheduling: false
      evictionRequested: false
      storageReserved: 25362624921
      tags: []
---
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: talos-7tm-1kh
  namespace: longhorn-system
  labels:
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/part-of: storage
spec:
  allowScheduling: true
  tags:
    - performance
    - performance-primary
    - nvme
    - nvme-202
  disks:
    default-disk-1030400000000:
      path: /var/lib/longhorn/
      allowScheduling: true
      evictionRequested: false
      storageReserved: 199711320473
      tags:
        - nvme
        - node-202
        - nvme-202
    sdb-ssd:
      path: /var/mnt/longhorn-sdb
      allowScheduling: true
      evictionRequested: false
      storageReserved: 53687091200
      tags:
        - ssd
        - node-202
        - sdb
---
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: passer-w-01
  namespace: longhorn-system
  labels:
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/part-of: storage
spec:
  allowScheduling: true
  tags:
    - performance
    - nvme
    - nvme-201
  disks:
    default-disk-nvme0n1:
      path: /var/lib/longhorn/
      allowScheduling: true
      evictionRequested: false
      storageReserved: 100000000000
      tags:
        - nvme
        - node-201
        - nvme-201
---
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: passer-w-03
  namespace: longhorn-system
  labels:
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/part-of: storage
spec:
  allowScheduling: true
  tags:
    - capacity
    - backup
    - hdd
    - media
  disks:
    default-disk-sdd:
      path: /var/lib/longhorn/
      allowScheduling: true
      evictionRequested: false
      storageReserved: 50000000000
      tags:
        - ssd
        - node-203
    longhorn-sda:
      path: /var/mnt/longhorn-sda
      allowScheduling: true
      evictionRequested: false
      storageReserved: 100000000000
      tags:
        - hdd
        - media
        - node-203
    longhorn-sdb:
      path: /var/mnt/longhorn-sdb
      allowScheduling: true
      evictionRequested: false
      storageReserved: 100000000000
      tags:
        - hdd
        - media
        - node-203
