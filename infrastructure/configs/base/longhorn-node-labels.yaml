---
# Longhorn Node CRs: declare each node's disks, tags, and scheduling policy.
#
# Node LABELS (storage-tier, disk-type, …) are NOT managed here anymore —
# they are applied by `scripts/apply-node-labels.sh`. Earlier this file
# also contained `apiVersion: v1 kind: Node` entries with just labels; a
# Flux reconcile with `prune: true` deleted the real Node objects when
# we renamed them. The kubelet owns the Node object; GitOps owns the
# Longhorn config.
---
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: passer-cp-01
  namespace: longhorn-system
  labels:
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/part-of: storage
spec:
  allowScheduling: false
  tags: []
  disks:
    default-disk-1030400000000:
      path: /var/lib/longhorn
      allowScheduling: false
      evictionRequested: false
      storageReserved: 25362624921
      tags: []
---
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: passer-w-02
  namespace: longhorn-system
  labels:
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/part-of: storage
spec:
  allowScheduling: true
  tags:
    - performance
    - performance-primary
    - nvme
    - nvme-202
  disks:
    default-disk-1030400000000:
      path: /var/lib/longhorn/
      allowScheduling: true
      evictionRequested: false
      storageReserved: 199711320473
      tags:
        - nvme
        - node-202
        - nvme-202
    sdb-ssd:
      path: /var/mnt/longhorn-sdb
      allowScheduling: true
      evictionRequested: false
      storageReserved: 53687091200
      tags:
        - ssd
        - node-202
        - sdb
---
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: passer-w-01
  namespace: longhorn-system
  labels:
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/part-of: storage
spec:
  allowScheduling: true
  tags:
    - performance
    - nvme
    - nvme-201
  disks:
    default-disk-nvme0n1:
      path: /var/lib/longhorn/
      allowScheduling: true
      evictionRequested: false
      storageReserved: 100000000000
      tags:
        - nvme
        - node-201
        - nvme-201
---
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: passer-w-03
  namespace: longhorn-system
  labels:
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/part-of: storage
spec:
  allowScheduling: true
  tags:
    - capacity
    - backup
    - hdd
    - media
  disks:
    default-disk-sdd:
      path: /var/lib/longhorn/
      allowScheduling: true
      evictionRequested: false
      storageReserved: 50000000000
      tags:
        - ssd
        - node-203
    longhorn-sda:
      path: /var/mnt/longhorn-sda
      allowScheduling: true
      evictionRequested: false
      storageReserved: 100000000000
      tags:
        - hdd
        - media
        - node-203
    longhorn-sdb:
      path: /var/mnt/longhorn-sdb
      allowScheduling: true
      evictionRequested: false
      storageReserved: 100000000000
      tags:
        - hdd
        - media
        - node-203
