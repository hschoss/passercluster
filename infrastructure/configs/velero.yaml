---
apiVersion: v1
kind: Namespace
metadata:
  name: velero
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
# MinIO lives on the corvus Pi (192.168.179.2) and the bucket is created
# during the Pi's MinIO install (see docs/VELERO-SETUP.md). The in-cluster
# bucket-setup Job that previously ran against 192.168.178.2 is removed.
#
# Reachability: the cluster LAN (192.168.178.0/24) cannot route to the
# corvus LAN (192.168.179.0/24) directly. The passer Pi (.178.2) accepts
# the 192.168.179.0/24 subnet route from the `corvus-datahub` tailscale
# subnet router, and runs a socat proxy container (`minio-proxy`) that
# listens on 192.168.178.2:9000 and forwards to 192.168.179.2:9000. The
# BSL therefore points at the passer-side endpoint; the data path transits
# via the tailscale subnet route through corvus-datahub.
#
# Snapshot strategy: Kopia file-system backup (FSB) only.
# CSI VolumeSnapshotClass CRDs are not installed cluster-wide yet; once the
# external-snapshotter is deployed, flip EnableCSI + VolumeSnapshotLocation
# in a follow-up change.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: vmware-tanzu
  namespace: velero
spec:
  interval: 24h
  url: https://vmware-tanzu.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: velero
spec:
  interval: 12h
  chart:
    spec:
      chart: velero
      version: "12.2.1"
      sourceRef:
        kind: HelmRepository
        name: vmware-tanzu
        namespace: velero
      interval: 12h
  install:
    crds: Create
    remediation:
      retries: 5
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    initContainers:
      - name: velero-plugin-for-aws
        image: velero/velero-plugin-for-aws:v1.10.1
        imagePullPolicy: IfNotPresent
        volumeMounts:
          - mountPath: /target
            name: plugins
    configuration:
      uploaderType: kopia
      defaultVolumesToFsBackup: true
      backupStorageLocation:
        - name: default
          provider: aws
          bucket: passer-velero
          default: true
          config:
            region: minio
            s3ForcePathStyle: "true"
            s3Url: http://192.168.178.2:9000
            publicUrl: http://192.168.178.2:9000
    credentials:
      useSecret: true
      existingSecret: velero-credentials
    deployNodeAgent: true
    nodeAgent:
      podVolumePath: /var/lib/kubelet/pods
      privileged: false
    snapshotsEnabled: false
