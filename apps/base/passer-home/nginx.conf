server {
    listen       8080 default_server;
    listen  [::]:8080 default_server;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;
    charset utf-8;

    # markdown served as plain text so browsers render it directly
    types {
        text/html                             html htm;
        text/plain                            md txt;
        text/css                              css;
        application/javascript                js;
        image/svg+xml                         svg;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/x-icon                          ico;
    }
    default_type text/plain;

    location = / {
        try_files /index.html =404;
    }

    location /docs/ {
        alias /usr/share/nginx/html/docs/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
}
