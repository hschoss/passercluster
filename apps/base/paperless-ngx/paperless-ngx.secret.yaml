# apps/base/paperless-ngx/secret.yaml  — encrypt with: sops -e -i secret.yaml
apiVersion: v1
kind: Secret
metadata:
    name: paperless-ngx-secret
    namespace: paperless-ngx
stringData:
    PAPERLESS_ADMIN_USER: admin
    PAPERLESS_ADMIN_PASSWORD: [REDACTED_ROTATED_PASSWORD]
    PAPERLESS_SECRET_KEY: [REDACTED_ROTATED_SECRET_KEY]
