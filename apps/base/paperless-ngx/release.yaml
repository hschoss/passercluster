apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-ngx
  namespace: paperless-ngx
spec:
  interval: 30m
  chart:
    spec:
      chart: paperless-ngx
      version: ">=0.1.0"
      sourceRef:
        kind: HelmRepository
        name: paperless-ngx
        namespace: paperless-ngx
  values:
    global:
      security:
        allowInsecureImages: true
    ingress:
      main:
        enabled: false
    env:
      PAPERLESS_TIME_ZONE: Europe/Berlin
      PAPERLESS_OCR_LANGUAGE: deu+eng
      PAPERLESS_URL: https://paperless.passer.lan
      PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
      PAPERLESS_SOCIAL_AUTO_SIGNUP: "true"
      PAPERLESS_ACCOUNT_ALLOW_SIGNUPS: "false"
    persistence:
      data:
        enabled: true
        storageClass: longhorn-immich-fast
        accessMode: ReadWriteOnce
        size: 10Gi
      media:
        enabled: true
        storageClass: longhorn-immich-fast
        accessMode: ReadWriteOnce
        size: 50Gi
      export:
        enabled: true
        storageClass: longhorn-immich-fast
        accessMode: ReadWriteOnce
        size: 5Gi
      consume:
        enabled: true
        storageClass: longhorn-immich-fast
        accessMode: ReadWriteOnce
        size: 5Gi
    postgresql:
      enabled: true
      image:
        repository: bitnamilegacy/postgresql
    redis:
      enabled: true
      image:
        repository: bitnamilegacy/redis
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: paperless-ngx
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: paperless-ngx
                labels:
                  power-tier: optional
              spec:
                template:
                  spec:
                    containers:
                      - name: paperless-ngx
                        envFrom:
                          - secretRef:
                              name: paperless-ngx-secret
                          - secretRef:
                              name: paperless-oidc
                        env:
                          - name: REQUESTS_CA_BUNDLE
                            value: /certs/passer-lan.crt
                          - name: SSL_CERT_FILE
                            value: /certs/passer-lan.crt
                        volumeMounts:
                          - name: passer-lan-ca
                            mountPath: /certs
                            readOnly: true
                    volumes:
                      - name: passer-lan-ca
                        secret:
                          secretName: passer-lan-tls
                          items:
                            - key: tls.crt
                              path: passer-lan.crt
