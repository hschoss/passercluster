---
# "Folding" is a historical name — the workload is actually BOINC
# attached to Einstein@Home (einstein.phys.uwm.edu). Kept as `folding`
# so the sonnen-power-controller's enable_folding()/disable_folding()
# keep targeting it without rewiring config.
#
# Scale: replicas=0 until the sonnen controller enters BURN stage.
# Attachment: the BOINC client reads account_<project>.xml at startup
# from /var/lib/boinc/. The `einstein-account` SOPS secret is mounted
# at that path with the auth key.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: folding
  namespace: folding
  labels:
    app.kubernetes.io/name: folding
    power-tier: surplus
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: folding
  template:
    metadata:
      labels:
        app.kubernetes.io/name: folding
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # BOINC rewrites account_*.xml at runtime to persist the
        # computer ID and other state, so the account file must live
        # on a writable volume. Copy it from the Secret volume into
        # the emptyDir before the main container starts.
        - name: install-account
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              cp /secret/account_einstein.phys.uwm.edu.xml /var/lib/boinc/
              chmod 600 /var/lib/boinc/account_einstein.phys.uwm.edu.xml
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: boinc-data
              mountPath: /var/lib/boinc
            - name: einstein-account
              mountPath: /secret
              readOnly: true
      containers:
        - name: boinc
          image: boinc/client:latest
          imagePullPolicy: IfNotPresent
          # No args — the client auto-attaches on first start by
          # finding the account_einstein.phys.uwm.edu.xml file at
          # /var/lib/boinc/ (dropped there by the initContainer).
          resources:
            # Deliberately generous so BOINC fills surplus power when
            # the sonnen controller permits it.
            requests:
              cpu: "2"
              memory: 1Gi
            limits:
              cpu: "6"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: boinc-data
              mountPath: /var/lib/boinc
      volumes:
        - name: boinc-data
          emptyDir: {}
        - name: einstein-account
          secret:
            secretName: einstein-account
            items:
              - key: account_einstein.phys.uwm.edu.xml
                path: account_einstein.phys.uwm.edu.xml
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [passer-w-03, passer-w-02]
