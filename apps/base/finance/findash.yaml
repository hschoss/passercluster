# Findash: Dash app + price-sync loop + CNPG Postgres + migration Job + tailscale sidecar
# that routes to corvus-datahub (100.64.0.2) in the same Headscale tailnet.
---
apiVersion: v1
kind: Service
metadata:
  name: findash
  namespace: finance
  labels:
    app.kubernetes.io/name: findash
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: findash
  ports:
    - name: http
      port: 5000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: findash
  namespace: finance
  labels:
    app.kubernetes.io/name: findash
spec:
  replicas: 1
  # Recreate: the tailscale state PVC is RWO, and two pods sharing one
  # tailnet identity would fight over it.
  strategy:
    type: Recreate
    # Explicit null: Flux server-side apply otherwise keeps the defaulted
    # rollingUpdate block, which the API rejects together with Recreate.
    rollingUpdate: null
  selector:
    matchLabels:
      app.kubernetes.io/name: findash
  template:
    metadata:
      labels:
        app.kubernetes.io/name: findash
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        # --- Outbound tailscale sidecar in kernel mode. Gives the pod a
        # tailscale0 interface so findash can reach 100.64.0.2 directly.
        # Its node identity lives on the findash-egress-state PVC, so a pod
        # restart re-uses the same Headscale node instead of registering
        # findash-1, findash-2, … and does not need a fresh preauth key.
        # The hostname differs from findash-tailnet's ("findash") on purpose.
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:v1.86.2
          env:
            - name: TS_HOSTNAME
              value: findash-egress
            - name: TS_USERSPACE
              value: "false"
            - name: TS_EXTRA_ARGS
              value: "--login-server=https://passer.schloschi.com --accept-dns=false --accept-routes=false"
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: headscale-authkey
                  key: TS_AUTHKEY
                  optional: true
            - name: TS_STATE_DIR
              value: /var/lib/tailscale
            - name: TS_KUBE_SECRET
              value: ""
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [NET_ADMIN, NET_RAW]
          resources:
            requests: { cpu: 10m,  memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          volumeMounts:
            - name: ts-state
              mountPath: /var/lib/tailscale
            - name: ts-tmp
              mountPath: /tmp
            - name: dev-net-tun
              mountPath: /dev/net/tun
        # --- Findash app (Dash + gunicorn)
        - name: findash
          image: ghcr.io/hschoss/findash:2026-11-11-sync
          imagePullPolicy: IfNotPresent
          # Bypass `uv run` (which tries to rebuild the editable install at
          # startup and can't write LICENSE under non-root). Call gunicorn
          # straight from the baked venv.
          command: ["/app/.venv/bin/gunicorn"]
          args:
            - findash.app.main:server
            - --bind=0.0.0.0:5000
            - --workers=2
            # The first request in each worker makes Dash build every page
            # layout once, and each layout queries the dataserver over the
            # relayed tailnet link (~240 ms per round trip). That takes
            # longer than gunicorn's default 30 s, which killed the worker
            # mid-request and put the pod into a restart loop.
            - --timeout=300
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: HOME
              value: /tmp
            - name: UV_CACHE_DIR
              value: /tmp/uv-cache
          envFrom:
            - configMapRef:
                name: findash-config
            - secretRef:
                name: findash-db
            - secretRef:
                name: findash-dataserver
          # Up to 10 min for the slow first requests (see --timeout above);
          # liveness and readiness only start once this has passed.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "1",  memory: 1Gi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: app-tmp
              mountPath: /tmp
        # --- Price sync: corvus-datahub (derived.v_etf_daily_price_current)
        # -> market.prices in findash-postgres. The Rueckschau pages read
        # only from that local table, so without this loop they never see
        # datahub data. It lives in this pod because only this pod has the
        # tailscale0 route to 100.64.0.2; a CronJob would need its own
        # tailnet identity. Which instruments are mirrored is decided by
        # config/sync_mapping.yaml inside the image.
        - name: sync
          image: ghcr.io/hschoss/findash:2026-11-11-sync
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              # The datahub ingests twice a day; every 6 h is plenty.
              # After a failure (tailnet not up yet, datahub asleep) retry
              # after 5 min instead of waiting a full interval.
              while true; do
                if /app/.venv/bin/findash sync run; then
                  sleep 21600
                else
                  sleep 300
                fi
              done
          env:
            - name: HOME
              value: /tmp
          envFrom:
            - configMapRef:
                name: findash-config
            - secretRef:
                name: findash-db
            - secretRef:
                name: findash-dataserver
          resources:
            requests: { cpu: 20m,  memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: sync-tmp
              mountPath: /tmp
      volumes:
        - name: sync-tmp
          emptyDir: {}
        - name: ts-state
          persistentVolumeClaim:
            claimName: findash-egress-state
        - name: ts-tmp
          emptyDir: {}
        - name: app-tmp
          emptyDir: {}
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
---
# Persistent tailscale identity for the egress sidecar above.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: findash-egress-state
  namespace: finance
  labels:
    app.kubernetes.io/name: findash
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: findash-config
  namespace: finance
data:
  APP_ENV: production
  LOG_LEVEL: INFO
  DEBUG: "false"
  DISPLAY_TIMEZONE: Europe/Berlin
  STALE_FORECAST_HOURS: "36"
---
# Findash-own Postgres via CNPG. DATABASE_URL is composed by CNPG into the
# findash-db secret (key: uri) which envFrom pulls into the findash container.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: findash-postgres
  namespace: finance
spec:
  instances: 1
  bootstrap:
    initdb:
      database: findash
      owner: findash
      secret:
        name: findash-db
  storage:
    size: 5Gi
    storageClass: longhorn
  resources:
    requests: { cpu: 50m,  memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }
---
# Idempotent schema migration. Runs once per manifest revision.
# No `findash seed-demo` here: it would overwrite the real prices the sync
# container mirrors from the datahub with synthetic ones (up to 2024-12-31).
apiVersion: batch/v1
kind: Job
metadata:
  name: findash-migrate
  namespace: finance
  annotations:
    kustomize.toolkit.fluxcd.io/force: "true"
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: ghcr.io/hschoss/findash:2026-11-11-sync
          command: ["/bin/sh", "-euxc"]
          args:
            - |
              /app/.venv/bin/alembic upgrade head
          envFrom:
            - configMapRef:
                name: findash-config
            - secretRef:
                name: findash-db
