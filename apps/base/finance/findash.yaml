# Findash: Dash app + CNPG Postgres + migration Job + tailscale sidecar
# that routes to corvus-datahub (100.64.0.2) in the same Headscale tailnet.
---
apiVersion: v1
kind: Service
metadata:
  name: findash
  namespace: finance
  labels:
    app.kubernetes.io/name: findash
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: findash
  ports:
    - name: http
      port: 5000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: findash
  namespace: finance
  labels:
    app.kubernetes.io/name: findash
spec:
  replicas: 1
  # Recreate: the tailscale state PVC is RWO, and two pods sharing one
  # tailnet identity would fight over it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: findash
  template:
    metadata:
      labels:
        app.kubernetes.io/name: findash
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        # --- Outbound tailscale sidecar in kernel mode. Gives the pod a
        # tailscale0 interface so findash can reach 100.64.0.2 directly.
        # Its node identity lives on the findash-egress-state PVC, so a pod
        # restart re-uses the same Headscale node instead of registering
        # findash-1, findash-2, … and does not need a fresh preauth key.
        # The hostname differs from findash-tailnet's ("findash") on purpose.
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:v1.86.2
          env:
            - name: TS_HOSTNAME
              value: findash-egress
            - name: TS_USERSPACE
              value: "false"
            - name: TS_EXTRA_ARGS
              value: "--login-server=https://passer.schloschi.com --accept-dns=false --accept-routes=false"
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: headscale-authkey
                  key: TS_AUTHKEY
                  optional: true
            - name: TS_STATE_DIR
              value: /var/lib/tailscale
            - name: TS_KUBE_SECRET
              value: ""
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [NET_ADMIN, NET_RAW]
          resources:
            requests: { cpu: 10m,  memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          volumeMounts:
            - name: ts-state
              mountPath: /var/lib/tailscale
            - name: ts-tmp
              mountPath: /tmp
            - name: dev-net-tun
              mountPath: /dev/net/tun
        # --- Findash app (Dash + gunicorn)
        - name: findash
          image: ghcr.io/hschoss/findash:e37d54c
          imagePullPolicy: IfNotPresent
          # Bypass `uv run` (which tries to rebuild the editable install at
          # startup and can't write LICENSE under non-root). Call gunicorn
          # straight from the baked venv.
          command: ["/app/.venv/bin/gunicorn"]
          args:
            - findash.app.main:server
            - --bind=0.0.0.0:5000
            - --workers=2
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: HOME
              value: /tmp
            - name: UV_CACHE_DIR
              value: /tmp/uv-cache
          envFrom:
            - configMapRef:
                name: findash-config
            - secretRef:
                name: findash-db
            - secretRef:
                name: findash-dataserver
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "1",  memory: 1Gi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: app-tmp
              mountPath: /tmp
      volumes:
        - name: ts-state
          persistentVolumeClaim:
            claimName: findash-egress-state
        - name: ts-tmp
          emptyDir: {}
        - name: app-tmp
          emptyDir: {}
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
---
# Persistent tailscale identity for the egress sidecar above.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: findash-egress-state
  namespace: finance
  labels:
    app.kubernetes.io/name: findash
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: findash-config
  namespace: finance
data:
  APP_ENV: production
  LOG_LEVEL: INFO
  DEBUG: "false"
  DISPLAY_TIMEZONE: Europe/Berlin
  STALE_FORECAST_HOURS: "36"
---
# Findash-own Postgres via CNPG. DATABASE_URL is composed by CNPG into the
# findash-db secret (key: uri) which envFrom pulls into the findash container.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: findash-postgres
  namespace: finance
spec:
  instances: 1
  bootstrap:
    initdb:
      database: findash
      owner: findash
      secret:
        name: findash-db
  storage:
    size: 5Gi
    storageClass: longhorn
  resources:
    requests: { cpu: 50m,  memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }
---
# Idempotent migration + optional seed-demo. Runs once per manifest revision.
apiVersion: batch/v1
kind: Job
metadata:
  name: findash-migrate
  namespace: finance
  annotations:
    kustomize.toolkit.fluxcd.io/force: "true"
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: ghcr.io/hschoss/findash:e37d54c
          command: ["/bin/sh", "-euxc"]
          args:
            - |
              /app/.venv/bin/alembic upgrade head
              /app/.venv/bin/findash seed-demo || true
          envFrom:
            - configMapRef:
                name: findash-config
            - secretRef:
                name: findash-db
