server {
    listen       8080 default_server;
    listen  [::]:8080 default_server;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;
    charset utf-8;

    location = / {
        try_files /index.html =404;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
}
