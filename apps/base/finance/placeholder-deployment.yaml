apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-placeholder
  namespace: finance
  labels:
    app.kubernetes.io/name: finance-placeholder
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: finance-placeholder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finance-placeholder
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: www
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: nginx-conf
          configMap:
            name: finance-placeholder-nginx
        - name: www
          configMap:
            name: finance-placeholder-www
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: finance-placeholder
  namespace: finance
  labels:
    app.kubernetes.io/name: finance-placeholder
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: finance-placeholder
  ports:
    - name: http
      port: 80
      targetPort: http
