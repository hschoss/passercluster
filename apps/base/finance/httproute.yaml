apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: finance
  namespace: finance
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway-system
      sectionName: http
    - name: envoy
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - finance.passer.lan
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # Swap to `findash` (port 5000) once the Findash Deployment is running.
        - name: finance-placeholder
          port: 80
