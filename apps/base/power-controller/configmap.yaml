apiVersion: v1
kind: ConfigMap
metadata:
  name: power-mode
  namespace: power-controller
  labels:
    homelab/role: power-controller
data:
  # Values written by the controller on every stage transition:
  #   low_power | normal | burn | hold
  mode: normal
  # ISO 8601 timestamp of the last transition. "unknown" until the controller
  # writes its first decision.
  since: unknown
  reason: "initial seed, controller has not yet run"
