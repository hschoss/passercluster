---
# The sonnen-homelab-power-controller runs on the passer Pi (docker-compose)
# and uses a kubeconfig that authenticates as this ServiceAccount to drive
# scale actions in the passercluster.
#
# To mint a kubeconfig for the Pi:
#
#   kubectl -n power-controller create token sonnen-power-controller \
#     --duration=8760h > /tmp/sonnen.token
#   kubectl config view --minify --raw > /tmp/sonnen.kubeconfig
#   # edit /tmp/sonnen.kubeconfig: replace users: block with
#   #   users:
#   #     - name: admin@passercluster
#   #       user:
#   #         token: <contents of /tmp/sonnen.token>
#   scp /tmp/sonnen.kubeconfig vault@192.168.178.2:/home/vault/.kube/config
#
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sonnen-power-controller
  namespace: power-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sonnen-power-controller
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list", "patch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sonnen-power-controller
subjects:
  - kind: ServiceAccount
    name: sonnen-power-controller
    namespace: power-controller
roleRef:
  kind: ClusterRole
  name: sonnen-power-controller
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sonnen-power-controller-mode
  namespace: power-controller
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "update", "patch"]
    resourceNames: ["power-mode"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sonnen-power-controller-mode
  namespace: power-controller
subjects:
  - kind: ServiceAccount
    name: sonnen-power-controller
    namespace: power-controller
roleRef:
  kind: Role
  name: sonnen-power-controller-mode
  apiGroup: rbac.authorization.k8s.io
