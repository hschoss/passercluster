---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nextcloud-oidc-bootstrap
  namespace: nextcloud
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nextcloud-oidc-bootstrap
  namespace: nextcloud
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nextcloud-oidc-bootstrap
  namespace: nextcloud
subjects:
  - kind: ServiceAccount
    name: nextcloud-oidc-bootstrap
    namespace: nextcloud
roleRef:
  kind: Role
  name: nextcloud-oidc-bootstrap
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: nextcloud-oidc-bootstrap
  namespace: nextcloud
  annotations:
    kustomize.toolkit.fluxcd.io/force: "true"
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nextcloud-oidc-bootstrap
    spec:
      restartPolicy: OnFailure
      serviceAccountName: nextcloud-oidc-bootstrap
      containers:
        - name: bootstrap
          image: bitnami/kubectl:1.31
          env:
            - name: OIDC_DISCOVERY_URL
              valueFrom:
                secretKeyRef:
                  name: nextcloud-oidc
                  key: OIDC_DISCOVERY_URL
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: nextcloud-oidc
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: nextcloud-oidc
                  key: OIDC_CLIENT_SECRET
            - name: OIDC_SCOPE
              valueFrom:
                secretKeyRef:
                  name: nextcloud-oidc
                  key: OIDC_SCOPE
          command:
            - /bin/bash
            - -euo
            - pipefail
            - -c
            - |
              echo "[bootstrap] waiting for nextcloud deployment"
              kubectl -n nextcloud rollout status deploy/nextcloud --timeout=15m
              POD=$(kubectl -n nextcloud get pod -l app.kubernetes.io/name=nextcloud -o jsonpath='{.items[0].metadata.name}')
              echo "[bootstrap] using pod $POD"

              occ() { kubectl -n nextcloud exec "$POD" -c nextcloud -- su -s /bin/sh www-data -c "php /var/www/html/occ $*"; }

              echo "[bootstrap] ensuring user_oidc app is installed"
              if ! occ app:list | grep -qi 'user_oidc'; then
                occ app:install user_oidc
              else
                occ app:enable user_oidc || true
              fi

              echo "[bootstrap] configuring Authentik provider"
              if occ user_oidc:provider | grep -qi 'Authentik'; then
                occ user_oidc:provider Authentik \
                  --clientid="$OIDC_CLIENT_ID" \
                  --clientsecret="$OIDC_CLIENT_SECRET" \
                  --discoveryuri="$OIDC_DISCOVERY_URL" \
                  --scope="$OIDC_SCOPE" \
                  --mapping-uid=preferred_username \
                  --mapping-display-name=name \
                  --mapping-email=email \
                  --unique-uid=1
              else
                occ user_oidc:provider Authentik \
                  --clientid="$OIDC_CLIENT_ID" \
                  --clientsecret="$OIDC_CLIENT_SECRET" \
                  --discoveryuri="$OIDC_DISCOVERY_URL" \
                  --scope="$OIDC_SCOPE" \
                  --mapping-uid=preferred_username \
                  --mapping-display-name=name \
                  --mapping-email=email \
                  --unique-uid=1
              fi
              echo "[bootstrap] done"
